# ─────────────────────────────────────────────────────
#  hyprlock.conf (Final Optimized Version)
# ─────────────────────────────────────────────────────

general {
    grace               = 1
    hide_cursor         = true
    no_fade_in          = false
    no_fade_out         = false
    ignore_empty_input  = false
}

# ── Background (Reduced GPU Load) ─────────────────────
background {
    monitor           =
    screenshot        = true
    blur_passes       = 2
    blur_size         = 6
    brightness        = 0.65
    contrast          = 0.90
    vibrancy          = 0.15
    vibrancy_darkness = 0.10
}

# ═══════════════════════════════════════════════════
#  TOP REGION — Clock & Date
# ═══════════════════════════════════════════════════

# ── Clock (Reduced Polling Frequency) ────────────────
label {
    monitor     =
    text        = cmd[update:5000] date +"%H:%M"
    font_size   = 80
    font_family = JetBrains Mono, monospace
    position    = 0, -60
    halign      = center
    valign      = top
    color       = rgba(255, 255, 255, 0.92)
}

# ── Date (Very Low Update Frequency) ─────────────────
label {
    monitor     =
    text        = cmd[update:600000] date +"%A · %d %B %Y"
    font_size   = 13
    font_family = sans-serif
    position    = 0, -190
    halign      = center
    valign      = top
    color       = rgba(255, 255, 255, 0.35)
}

# ═══════════════════════════════════════════════════
#  BOTTOM REGION — Authentication
# ═══════════════════════════════════════════════════

# ── Prompt ───────────────────────────────────────────
label {
    monitor     =
    text        = ENTER PASSWORD
    font_size   = 10
    font_family = sans-serif
    position    = 0, 150
    halign      = center
    valign      = bottom
    color       = rgba(255, 255, 255, 0.20)
}

# ── Input Field ──────────────────────────────────────
input-field {
    monitor           =
    size              = 280, 48
    position          = 0, 90
    halign            = center
    valign            = bottom

    outline_thickness = 1
    outer_color       = rgba(255, 255, 255, 0.10)
    inner_color       = rgba(255, 255, 255, 0.03)

    check_color       = rgba(120, 210, 150, 0.90)
    fail_color        = rgba(220, 85, 85, 0.90)
    fail_transition   = 300

    font_size         = 15
    font_family       = JetBrains Mono, monospace
    font_color        = rgba(255, 255, 255, 0.88)
    placeholder_color = rgba(255, 255, 255, 0.20)

    rounding          = 10
    placeholder_text  = enter password

    dots_center       = true
    dots_size         = 0.22
    dots_spacing      = 0.35
    dots_rounding     = -1
}

# ── Caps Lock Indicator (Controlled Polling) ─────────
label {
    monitor     =
    text        = cmd[update:2000] sh -c '[ "$(cat /sys/class/leds/*capslock*/brightness 2>/dev/null | head -n1)" = "1" ] && echo "CAPS LOCK ON" || echo ""'
    font_size   = 10
    font_family = sans-serif
    position    = 0, 50
    halign      = center
    valign      = bottom
    color       = rgba(240, 175, 75, 0.75)
}

# Autotheme: generated input-field colours (keeps the label colours static).
source = /home/aditya/.cache/autotheme/hyprlock-colors.conf
