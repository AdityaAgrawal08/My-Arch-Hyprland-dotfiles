# shellcheck shell=bash
# Autotheme runtime preferences.  This file is sourced by the scripts.
# Every value can be overridden from the environment.

# auto | awww | hyprpaper
WALLPAPER_BACKEND="${WALLPAPER_BACKEND:-auto}"

# Wallpaper library and generated thumbnail cache.  SCRIPT_DIR is provided by
# the caller before this file is sourced.
WALLPAPER_DIR="${WALLPAPER_DIR:-${SCRIPT_DIR}/../themes/wallpapers/assets}"
THUMBS_DIR="${THUMBS_DIR:-${SCRIPT_DIR}/../themes/wallpapers/thumbs}"

# random | wave | wipe | none
WALLPAPER_TRANSITION="${WALLPAPER_TRANSITION:-random}"

# auto | always | never  (never is useful for testing the fallback path)
AUTOTHEME_MATUGEN="${AUTOTHEME_MATUGEN:-auto}"

# Apply the generated Dunst colours when notifications are enabled.
AUTOTHEME_DUNST="${AUTOTHEME_DUNST:-1}"

# Show a notification after a wallpaper change.
AUTOTHEME_NOTIFY="${AUTOTHEME_NOTIFY:-0}"

# Reserved for a future mpvpaper backend; currently unused.
AUTOTHEME_VIDEO="${AUTOTHEME_VIDEO:-0}"
