# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window Layout
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines -1

# Do not remember size / maximized state. kitty caches the last window's
# "maximized" state in ~/.cache/kitty/main.json and re-applies it to every new
# window, which makes every terminal open maximized on top of other windows.
remember_window_size no
initial_window_width 800
initial_window_height 500

# Colors - Everforest Dark (Medium)
background            #000000
background_opacity 1.0
dynamic_background_opacity yes
allow_remote_control yes
foreground            #d3c6aa
cursor                #a7c080
cursor_text_color     #2b3339
selection_foreground  #d3c6aa
selection_background  #3d484d

# Black
color0  #4b565c
color8  #4b565c

# Red
color1  #e67e80
color9  #e67e80

# Green
color2  #a7c080
color10 #a7c080

# Yellow
color3  #dbbc7f
color11 #dbbc7f

# Blue
color4  #7fbbb3
color12 #7fbbb3

# Magenta
color5  #d699b6
color13 #d699b6

# Cyan
color6  #83c092
color14 #83c092

# White
color7  #d3c6aa
color15 #d3c6aa

# Keybindings
map ctrl+a launch --type=clipboard --stdin-source=@screen_scrollback

# Tab bar: on top, black bar; only the active tab (the one showing the
# current directory) is a yellow box with black text
tab_bar_edge            top
tab_bar_background      #000000
active_tab_background   yellow
active_tab_foreground   black
inactive_tab_background #000000
inactive_tab_foreground #d3c6aa
