# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window Layout
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines -1

# Do not remember size / maximized state. kitty caches the last window's
# "maximized" state in ~/.cache/kitty/main.json and re-applies it to every new
# window, which makes every terminal open maximized on top of other windows.
remember_window_size no
initial_window_width 800
initial_window_height 500

# Colors are generated from the current wallpaper by autotheme and included
# at the end of this file. The values below are the opaque-terminal fallback.
background            #000000
background_opacity 1.0
dynamic_background_opacity yes
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/kitty

# Keybindings
map ctrl+a launch --type=clipboard --stdin-source=@screen_scrollback

# Tab bar: colors are supplied by the generated autotheme include.
tab_bar_edge            top
tab_bar_background      #000000

# Autotheme: generated colour palette (opaque or transparent variant).
include /home/aditya/.cache/autotheme/kitty.conf
